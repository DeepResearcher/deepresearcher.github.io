name: Connect ProjectPlay Studio

on:
  push:
    paths:
      - '.github/workflows/connect-projectplay-studio.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace Digital Outputs page with Studio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          studio_url = 'https://studio.narli-digital.de/'

          # Replace every internal link that still points to the retired page.
          link_patterns = [
              r'href="/digital-outputs"',
              r'href="/digital-outputs/"',
              r'href="/digital-outputs\.html"',
              r'href="digital-outputs"',
              r'href="digital-outputs\.html"',
              r'href="https://www\.narli-digital\.de/digital-outputs"',
              r'href="https://narli-digital\.de/digital-outputs"',
          ]

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.json', '.md'}:
                  continue
              if '.git' in path.parts or path.name == 'digital-outputs.html':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              updated = text
              for pattern in link_patterns:
                  updated = re.sub(pattern, f'href="{studio_url}"', updated)

              # Existing page-specific navigation keys can stay in place, but
              # their user-facing label must now describe the actual destination.
              updated = updated.replace('"nav.outputs":"Digital Outputs"', '"nav.outputs":"Studio"')
              updated = updated.replace('"nav.outputs": "Digital Outputs"', '"nav.outputs": "Studio"')
              updated = updated.replace('"nav.outputs":"Digitale Outputs"', '"nav.outputs":"Studio"')
              updated = updated.replace('"nav.outputs": "Digitale Outputs"', '"nav.outputs": "Studio"')
              updated = updated.replace('data-i18n="nav.outputs">Digital Outputs</a>', 'data-i18n="nav.outputs">Studio</a>')
              updated = updated.replace('data-i18n="nav.outputs">Digitale Outputs</a>', 'data-i18n="nav.outputs">Studio</a>')

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          # Add Studio to the main site's desktop/mobile navigation and footer.
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          studio_anchor = f'        <a href="{studio_url}" data-i18n="nav.studio">Studio</a>\n'
          if 'data-i18n="nav.studio"' not in text:
              text = text.replace(
                  '        <a href="#portfolio" data-i18n="nav.portfolio">Portfolio</a>\n',
                  '        <a href="#portfolio" data-i18n="nav.portfolio">Portfolio</a>\n' + studio_anchor,
                  1,
              )
              footer_marker = '        <a href="#portfolio" data-i18n="nav.portfolio">Portfolio</a>\n'
              footer_pos = text.find(footer_marker, text.find('<footer'))
              if footer_pos != -1:
                  insert_at = footer_pos + len(footer_marker)
                  text = text[:insert_at] + studio_anchor + text[insert_at:]
          index.write_text(text, encoding='utf-8')
          changed.append('index.html')

          # Add the new translation key to the main language dictionary.
          script = Path('script.js')
          text = script.read_text(encoding='utf-8')
          text = text.replace(
              '"nav.portfolio":"Portfolio","nav.collaborate"',
              '"nav.portfolio":"Portfolio","nav.studio":"Studio","nav.collaborate"',
          )
          script.write_text(text, encoding='utf-8')
          changed.append('script.js')

          # Retire the old library page while preserving old bookmarks and search links.
          redirect_page = '''<!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <meta http-equiv="refresh" content="0; url=https://studio.narli-digital.de/">
            <link rel="canonical" href="https://studio.narli-digital.de/">
            <title>NARLI DIGITAL Studio</title>
            <link rel="icon" href="favicon.svg" type="image/svg+xml">
            <script>window.location.replace('https://studio.narli-digital.de/');</script>
          </head>
          <body>
            <p>Weiterleitung zum <a href="https://studio.narli-digital.de/">NARLI DIGITAL Studio</a>…</p>
          </body>
          </html>
          '''
          Path('digital-outputs.html').write_text(redirect_page, encoding='utf-8')
          changed.append('digital-outputs.html')

          # Cloudflare Pages performs the redirect before returning HTML.
          redirects = Path('_redirects')
          existing = redirects.read_text(encoding='utf-8') if redirects.exists() else ''
          rules = [
              '/digital-outputs https://studio.narli-digital.de/ 301',
              '/digital-outputs/ https://studio.narli-digital.de/ 301',
              '/digital-outputs.html https://studio.narli-digital.de/ 301',
          ]
          lines = [line.rstrip() for line in existing.splitlines() if line.strip()]
          for rule in rules:
              if rule not in lines:
                  lines.append(rule)
          redirects.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          changed.append('_redirects')

          # The retired URL must no longer be advertised as an indexable page.
          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              text = sitemap.read_text(encoding='utf-8')
              text = re.sub(
                  r'\s*<url>\s*<loc>https://www\.narli-digital\.de/digital-outputs</loc>.*?</url>',
                  '',
                  text,
                  flags=re.S,
              )
              sitemap.write_text(text, encoding='utf-8')
              changed.append('sitemap.xml')

          # Make sure no navigational reference to the retired page remains.
          remaining = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html', '.js', '.json', '.md', '.xml'}:
                  continue
              if '.git' in path.parts or path.name == 'digital-outputs.html':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if '/digital-outputs' in text or 'digital-outputs.html' in text:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit('Retired Digital Outputs references remain in: ' + ', '.join(sorted(set(remaining))))

          print('Updated:')
          for filename in sorted(set(changed)):
              print(filename)
          PY

      - name: Commit Studio connection and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/connect-projectplay-studio.yml
          git add -A
          git commit -m "Connect Digital Outputs route to ProjectPlay Studio [skip ci]"
          git push

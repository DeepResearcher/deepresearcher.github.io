name: Contact form worker

# Tests the Cloudflare Worker behind https://www.narli-digital.de/api/contact (request forms) and
# info@narli-digital.de (incoming mail) on pull requests and deploys it when it changes on main
# (or when started by hand).
# Deploying needs three repository secrets:
#   CLOUDFLARE_API_TOKEN   API token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
#   CONTACT_TO             the inbox for form messages (a verified Email Routing destination)

on:
  pull_request:
    paths:
      - "workers/contact-form/**"
      - ".github/workflows/contact-form-worker.yml"
  push:
    branches: [main]
    paths:
      - "workers/contact-form/**"
      - ".github/workflows/contact-form-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-form-worker-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: workers/contact-form

env:
  WRANGLER: wrangler@4.152.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node --test test/*.test.mjs

      - name: Bundle and config check (nothing is deployed)
        run: npx -y "$WRANGLER" deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTACT_TO: ${{ secrets.CONTACT_TO }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Required secrets are set
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CONTACT_TO; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      # Mail that the inbox refuses is kept here for 90 days (see src/inbox.js). The namespace is
      # created on the first run; its id is added to wrangler.toml only for this deploy.
      - name: Storage for undelivered mail (Workers KV)
        run: |
          title="narli-mail-undelivered"
          find_id() {
            npx -y "$WRANGLER" kv namespace list | sed -n '/^\[/,$p' \
              | jq -r --arg t "$title" '.[] | select(.title == $t or (.title | endswith("-" + $t))) | .id' | head -n 1
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            npx -y "$WRANGLER" kv namespace create "$title"
            id="$(find_id)"
          fi
          if [ -z "$id" ]; then
            echo "::error::Could not find or create the KV namespace $title"
            exit 1
          fi
          printf '\n[[kv_namespaces]]\nbinding = "UNDELIVERED"\nid = "%s"\n' "$id" >> wrangler.toml

      # The very first deploy of a new Worker can fail with "does not exist" while Cloudflare
      # catches up, so try once more after a short pause.
      - name: Deploy worker
        run: npx -y "$WRANGLER" deploy || { sleep 15; npx -y "$WRANGLER" deploy; }

      - name: Set inbox address
        run: printf '%s' "$CONTACT_TO" | npx -y "$WRANGLER" secret put CONTACT_TO

name: Diagnose Google tag runtime

on:
  push:
    paths:
      - '.github/workflows/diagnose-google-tag-runtime.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Puppeteer core
        run: npm install --no-save puppeteer-core

      - name: Test live tag in headless Chrome
        run: |
          cat > /tmp/test-tag.cjs <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const { execSync } = require('child_process');

          function findChrome() {
            const candidates = ['google-chrome-stable', 'google-chrome', 'chromium', 'chromium-browser'];
            for (const name of candidates) {
              try {
                return execSync(`command -v ${name}`, {encoding: 'utf8'}).trim();
              } catch (_) {}
            }
            throw new Error('Chrome/Chromium executable not found');
          }

          (async () => {
            const out = [];
            const executablePath = findChrome();
            out.push(`Generated UTC: ${new Date().toISOString()}`);
            out.push(`Chrome: ${executablePath}`);

            const browser = await puppeteer.launch({
              executablePath,
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });

            for (const url of ['https://narli-digital.de/', 'https://www.narli-digital.de/']) {
              out.push('');
              out.push(`===== ${url} =====`);
              const page = await browser.newPage();
              const requests = [];
              const responses = [];
              const failures = [];
              const consoleMessages = [];

              page.on('request', req => {
                const u = req.url();
                if (/google(tagmanager|\-analytics)|analytics\.google/.test(u)) {
                  requests.push(`${req.method()} ${u}`);
                }
              });
              page.on('response', res => {
                const u = res.url();
                if (/google(tagmanager|\-analytics)|analytics\.google/.test(u)) {
                  responses.push(`${res.status()} ${u}`);
                }
              });
              page.on('requestfailed', req => {
                const u = req.url();
                if (/google(tagmanager|\-analytics)|analytics\.google/.test(u)) {
                  failures.push(`${u} :: ${req.failure()?.errorText || 'unknown'}`);
                }
              });
              page.on('console', msg => consoleMessages.push(`${msg.type()}: ${msg.text()}`));
              page.on('pageerror', err => consoleMessages.push(`pageerror: ${err.message}`));

              let navStatus = null;
              try {
                const nav = await page.goto(url, {waitUntil: 'networkidle2', timeout: 60000});
                navStatus = nav ? nav.status() : null;
                await new Promise(r => setTimeout(r, 5000));
              } catch (err) {
                consoleMessages.push(`navigation-error: ${err.message}`);
              }

              const state = await page.evaluate(() => ({
                href: location.href,
                title: document.title,
                gtagType: typeof window.gtag,
                dataLayerExists: Array.isArray(window.dataLayer),
                dataLayerLength: Array.isArray(window.dataLayer) ? window.dataLayer.length : null,
                dataLayerPreview: Array.isArray(window.dataLayer)
                  ? window.dataLayer.slice(0, 10).map(item => {
                      try { return JSON.stringify(item); } catch (_) { return String(item); }
                    })
                  : [],
                scriptSources: Array.from(document.scripts).map(s => s.src || '[inline]').filter(s => /google|inline/.test(s)),
              }));

              out.push(`Navigation status: ${navStatus}`);
              out.push(`Final URL: ${state.href}`);
              out.push(`Title: ${state.title}`);
              out.push(`typeof window.gtag: ${state.gtagType}`);
              out.push(`dataLayer exists: ${state.dataLayerExists}`);
              out.push(`dataLayer length: ${state.dataLayerLength}`);
              out.push('dataLayer preview:');
              out.push(...state.dataLayerPreview.map(x => `  ${x}`));
              out.push('Google-related script sources:');
              out.push(...state.scriptSources.map(x => `  ${x}`));
              out.push('Google-related requests:');
              out.push(...(requests.length ? requests.map(x => `  ${x}`) : ['  NONE']));
              out.push('Google-related responses:');
              out.push(...(responses.length ? responses.map(x => `  ${x}`) : ['  NONE']));
              out.push('Google-related failures:');
              out.push(...(failures.length ? failures.map(x => `  ${x}`) : ['  NONE']));
              out.push('Console/page errors:');
              out.push(...(consoleMessages.length ? consoleMessages.map(x => `  ${x}`) : ['  NONE']));

              await page.close();
            }

            await browser.close();
            fs.writeFileSync('google-tag-runtime-diagnostic.txt', out.join('\n') + '\n');
          })().catch(err => {
            fs.writeFileSync('google-tag-runtime-diagnostic.txt', `FATAL: ${err.stack || err}\n`);
            process.exitCode = 1;
          });
          NODE
          node /tmp/test-tag.cjs

      - name: Commit diagnostic and remove workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-google-tag-runtime.yml
          git add google-tag-runtime-diagnostic.txt
          git commit -m "Diagnose Google tag runtime [skip ci]"
          git push

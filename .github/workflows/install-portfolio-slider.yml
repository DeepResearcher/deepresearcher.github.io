name: Install portfolio slider

on:
  push:
    paths:
      - ".github/workflows/install-portfolio-slider.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add slider script to the website
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          slider = '  <script src="portfolio-slider.js?v=20260720-1" defer></script>'

          if 'portfolio-slider.js' not in html:
              marker = '  <script src="script.js?v=20260720-portfolio-2" defer></script>'
              if marker in html:
                  html = html.replace(marker, marker + '\n' + slider, 1)
              else:
                  html = html.replace('</head>', slider + '\n</head>', 1)
              path.write_text(html, encoding='utf-8')
          PY

          rm -f .github/workflows/install-portfolio-slider.yml

      - name: Commit slider installation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/install-portfolio-slider.yml
          git commit -m "Enable high-resolution portfolio slider"
          git push

name: Optimize portfolio images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-portfolio-images.yml"
      - "assets/portfolio/originals/*.jpg"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Generate responsive WebP portfolio images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/portfolio/optimized
          for source in assets/portfolio/originals/*.jpg; do
            filename="$(basename "${source%.jpg}")"
            cwebp -quiet -q 74 -m 6 -resize 960 0 "$source" \
              -o "assets/portfolio/optimized/${filename}.webp"
          done

          sed -E -i \
            's#assets/portfolio/originals/(portfolio-[0-9]+)\.jpg#assets/portfolio/optimized/\1.webp#g' \
            portfolio-slider.js

      - name: Commit optimized assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- portfolio-slider.js assets/portfolio/optimized; then
            echo "No image changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-slider.js assets/portfolio/optimized
          git commit -m "Optimize portfolio images [skip ci]"
          git push

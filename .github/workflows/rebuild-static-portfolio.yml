name: Rebuild static portfolio

on:
  push:
    paths:
      - '.github/workflows/rebuild-static-portfolio.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace dynamic portfolio with stable static structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')

          stylesheet = '  <link rel="stylesheet" href="portfolio-gallery.css?v=20260720-static-1">\n'
          if 'portfolio-gallery.css' not in html:
              html = html.replace('  <link rel="stylesheet" href="redesign.css">\n', '  <link rel="stylesheet" href="redesign.css">\n' + stylesheet)

          html = re.sub(
              r'<script src="portfolio-slider\.js\?v=[^"]+" defer></script>',
              '<script src="portfolio-slider.js?v=20260720-static-1" defer></script>',
              html
          )

          portfolio_section = '''    <section class="section portfolio-section" id="portfolio">
      <div class="container">
        <div class="section-heading compact reveal">
          <span class="section-kicker" data-i18n="portfolio.kicker">Ausgewählte Arbeiten & Beispiele</span>
          <h2 data-i18n="portfolio.title">So können digitale Projektoutputs aussehen.</h2>
          <p class="portfolio-note" data-i18n="portfolio.intro">Die Beispiele sind in drei klaren Lösungskategorien gebündelt. Innerhalb jeder Kategorie können Sie durch die zugehörigen Konzepte blättern.</p>
        </div>

        <div class="portfolio-category-grid" aria-label="Portfolio-Kategorien">
          <article class="portfolio-category" data-category="0">
            <div class="portfolio-category-media">
              <img class="portfolio-category-image" src="assets/portfolio/originals/portfolio-08.jpg" alt="EcoSort Challenge" loading="lazy" decoding="async">
              <div class="portfolio-category-shade" aria-hidden="true"></div>
              <span class="portfolio-category-label">Digitale Lernspiele</span>
              <div class="portfolio-category-copy">
                <p class="portfolio-category-description">Mobile und browserbasierte Lernspiele für Wissenstransfer, Awareness und Gamification.</p>
                <h3 class="portfolio-category-item-title">EcoSort Challenge</h3>
              </div>
              <div class="portfolio-category-controls">
                <button type="button" class="portfolio-category-button portfolio-category-prev" aria-label="Vorheriges Beispiel">←</button>
                <span class="portfolio-category-counter" aria-live="polite">1 / 4</span>
                <button type="button" class="portfolio-category-button portfolio-category-next" aria-label="Nächstes Beispiel">→</button>
              </div>
            </div>
            <div class="portfolio-category-dots" aria-label="Beispiele auswählen"></div>
          </article>

          <article class="portfolio-category" data-category="1">
            <div class="portfolio-category-media">
              <img class="portfolio-category-image" src="assets/portfolio/originals/portfolio-02.jpg" alt="Chrono-Cogs" loading="lazy" decoding="async">
              <div class="portfolio-category-shade" aria-hidden="true"></div>
              <span class="portfolio-category-label">Szenario- & Simulationsspiele</span>
              <div class="portfolio-category-copy">
                <p class="portfolio-category-description">Entscheidungsbasierte Formate mit Rollen, Ressourcen, Konsequenzen und messbarem Fortschritt.</p>
                <h3 class="portfolio-category-item-title">Chrono-Cogs</h3>
              </div>
              <div class="portfolio-category-controls">
                <button type="button" class="portfolio-category-button portfolio-category-prev" aria-label="Vorheriges Beispiel">←</button>
                <span class="portfolio-category-counter" aria-live="polite">1 / 4</span>
                <button type="button" class="portfolio-category-button portfolio-category-next" aria-label="Nächstes Beispiel">→</button>
              </div>
            </div>
            <div class="portfolio-category-dots" aria-label="Beispiele auswählen"></div>
          </article>

          <article class="portfolio-category" data-category="2">
            <div class="portfolio-category-media">
              <img class="portfolio-category-image" src="assets/portfolio/originals/portfolio-05.jpg" alt="Ethical Choices Workshop" loading="lazy" decoding="async">
              <div class="portfolio-category-shade" aria-hidden="true"></div>
              <span class="portfolio-category-label">Workshop- & Brettspielformate</span>
              <div class="portfolio-category-copy">
                <p class="portfolio-category-description">Analoge und hybride Lernformate für moderierte Diskussionen, Teamarbeit und Reflexion.</p>
                <h3 class="portfolio-category-item-title">Ethical Choices Workshop</h3>
              </div>
              <div class="portfolio-category-controls">
                <button type="button" class="portfolio-category-button portfolio-category-prev" aria-label="Vorheriges Beispiel">←</button>
                <span class="portfolio-category-counter" aria-live="polite">1 / 2</span>
                <button type="button" class="portfolio-category-button portfolio-category-next" aria-label="Nächstes Beispiel">→</button>
              </div>
            </div>
            <div class="portfolio-category-dots" aria-label="Beispiele auswählen"></div>
          </article>
        </div>
      </div>
    </section>'''

          pattern = r'    <section class="section portfolio-section" id="portfolio">.*?    </section>'
          html, count = re.subn(pattern, portfolio_section, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Portfolio section replacement count was {count}')
          index_path.write_text(html, encoding='utf-8')

          js = r'''(() => {
  const categories = [
    {
      title: { de: "Digitale Lernspiele", en: "Digital Learning Games" },
      description: {
        de: "Mobile und browserbasierte Lernspiele für Wissenstransfer, Awareness und Gamification.",
        en: "Mobile and browser-based learning games for knowledge transfer, awareness and gamification."
      },
      items: [
        { title: "EcoSort Challenge", image: "assets/portfolio/originals/portfolio-08.jpg" },
        { title: "CyberWise Mission", image: "assets/portfolio/originals/portfolio-09.jpg" },
        { title: "Sustainable Millionaire", image: "assets/portfolio/originals/portfolio-01.jpg" },
        { title: "GreenFuture Academy", image: "assets/portfolio/originals/portfolio-10.jpg" }
      ]
    },
    {
      title: { de: "Szenario- & Simulationsspiele", en: "Scenario & Simulation Games" },
      description: {
        de: "Entscheidungsbasierte Formate mit Rollen, Ressourcen, Konsequenzen und messbarem Fortschritt.",
        en: "Decision-based formats with roles, resources, consequences and measurable progress."
      },
      items: [
        { title: "Chrono-Cogs", image: "assets/portfolio/originals/portfolio-02.jpg" },
        { title: "Scenario Lab", image: "assets/portfolio/originals/portfolio-07.jpg" },
        { title: "Project Nexus", image: "assets/portfolio/originals/portfolio-06.jpg" },
        { title: "Project Aegis", image: "assets/portfolio/originals/portfolio-03.jpg" }
      ]
    },
    {
      title: { de: "Workshop- & Brettspielformate", en: "Workshop & Board Game Formats" },
      description: {
        de: "Analoge und hybride Lernformate für moderierte Diskussionen, Teamarbeit und Reflexion.",
        en: "Analogue and hybrid learning formats for facilitated discussion, teamwork and reflection."
      },
      items: [
        { title: "Ethical Choices Workshop", image: "assets/portfolio/originals/portfolio-05.jpg" },
        { title: "Collaborative Board Game", image: "assets/portfolio/originals/portfolio-04.jpg" }
      ]
    }
  ];

  const copy = {
    de: {
      intro: "Die Beispiele sind in drei klaren Lösungskategorien gebündelt. Innerhalb jeder Kategorie können Sie durch die zugehörigen Konzepte blättern.",
      previous: "Vorheriges Beispiel",
      next: "Nächstes Beispiel",
      dots: "Beispiele auswählen",
      hero: "Standort Berlin/Brandenburg · Europaweit tätig",
      contact: "Persönliche Gespräche in Berlin · Digitale Zusammenarbeit europaweit",
      why: "Gute digitale Outputs brauchen mehr als Code. Sie müssen zur Zielgruppe, zum Inhalt, zum Zeitplan, zum Budget und zur langfristigen Nutzung passen. Genau diese Verbindung bildet den Kern unserer Arbeit. Aus der Region Berlin/Brandenburg arbeiten wir mit internationalen Projektteams und Organisationen in ganz Europa zusammen.",
      footer: "Standort Berlin/Brandenburg · Europaweit tätig"
    },
    en: {
      intro: "The examples are grouped into three clear solution categories. Browse the related concepts within each category.",
      previous: "Previous example",
      next: "Next example",
      dots: "Select examples",
      hero: "Berlin/Brandenburg location · Working across Europe",
      contact: "In-person meetings in Berlin · Digital collaboration across Europe",
      why: "Strong digital outputs require more than code. They must fit the target group, content, timeline, budget and long-term use. Connecting these elements is at the core of our work. From the Berlin/Brandenburg region, we collaborate with international project teams and organisations across Europe.",
      footer: "Berlin/Brandenburg location · Working across Europe"
    }
  };

  const states = categories.map(() => 0);

  function language() {
    return document.documentElement.lang === "en" ? "en" : "de";
  }

  function cardFor(index) {
    return document.querySelector(`.portfolio-category[data-category="${index}"]`);
  }

  function renderCard(categoryIndex, animate = false) {
    const category = categories[categoryIndex];
    const card = cardFor(categoryIndex);
    if (!card) return;

    const itemIndex = states[categoryIndex];
    const item = category.items[itemIndex];
    const lang = language();
    const image = card.querySelector(".portfolio-category-image");

    if (animate) image.classList.add("is-changing");
    const apply = () => {
      image.src = item.image;
      image.alt = item.title;
      card.querySelector(".portfolio-category-label").textContent = category.title[lang];
      card.querySelector(".portfolio-category-description").textContent = category.description[lang];
      card.querySelector(".portfolio-category-item-title").textContent = item.title;
      card.querySelector(".portfolio-category-counter").textContent = `${itemIndex + 1} / ${category.items.length}`;
      card.querySelector(".portfolio-category-prev").setAttribute("aria-label", copy[lang].previous);
      card.querySelector(".portfolio-category-next").setAttribute("aria-label", copy[lang].next);
      card.querySelector(".portfolio-category-dots").setAttribute("aria-label", copy[lang].dots);
      card.querySelectorAll(".portfolio-category-dot").forEach((dot, dotIndex) => {
        dot.classList.toggle("is-active", dotIndex === itemIndex);
        dot.setAttribute("aria-current", dotIndex === itemIndex ? "true" : "false");
      });
      requestAnimationFrame(() => image.classList.remove("is-changing"));
    };

    animate ? window.setTimeout(apply, 110) : apply();
  }

  function move(categoryIndex, direction) {
    const count = categories[categoryIndex].items.length;
    states[categoryIndex] = (states[categoryIndex] + direction + count) % count;
    renderCard(categoryIndex, true);
  }

  function initialisePortfolio() {
    document.querySelectorAll(".portfolio-category").forEach((card, categoryIndex) => {
      const dots = card.querySelector(".portfolio-category-dots");
      dots.innerHTML = categories[categoryIndex].items.map((item, itemIndex) =>
        `<button type="button" class="portfolio-category-dot${itemIndex === 0 ? " is-active" : ""}" aria-label="${item.title}" aria-current="${itemIndex === 0 ? "true" : "false"}"></button>`
      ).join("");

      card.querySelector(".portfolio-category-prev").addEventListener("click", () => move(categoryIndex, -1));
      card.querySelector(".portfolio-category-next").addEventListener("click", () => move(categoryIndex, 1));
      dots.querySelectorAll(".portfolio-category-dot").forEach((dot, itemIndex) => {
        dot.addEventListener("click", () => {
          states[categoryIndex] = itemIndex;
          renderCard(categoryIndex, true);
        });
      });

      let startX = null;
      const media = card.querySelector(".portfolio-category-media");
      media.addEventListener("pointerdown", event => {
        if (event.target.closest("button")) return;
        startX = event.clientX;
      });
      media.addEventListener("pointerup", event => {
        if (startX === null) return;
        const delta = event.clientX - startX;
        startX = null;
        if (Math.abs(delta) >= 50) move(categoryIndex, delta < 0 ? 1 : -1);
      });
      media.addEventListener("pointercancel", () => { startX = null; });

      categories[categoryIndex].items.forEach(item => {
        const preload = new Image();
        preload.src = item.image;
      });

      renderCard(categoryIndex);
    });
  }

  function applyLanguageAndLocation() {
    const lang = language();
    const text = copy[lang];
    const intro = document.querySelector('#portfolio [data-i18n="portfolio.intro"]');
    if (intro) intro.textContent = text.intro;
    categories.forEach((_, index) => renderCard(index));

    const heroLocation = document.querySelector('[data-i18n="hero.trust3"]');
    if (heroLocation) heroLocation.textContent = text.hero;
    const whyText = document.querySelector('[data-i18n="why.text"]');
    if (whyText) whyText.textContent = text.why;
    const footerLocation = document.querySelector(".footer-meta > span:first-child");
    if (footerLocation) footerLocation.textContent = text.footer;

    const contactCard = document.querySelector(".contact-step-card");
    if (contactCard) {
      let note = contactCard.querySelector(".location-identity-note");
      if (!note) {
        note = document.createElement("p");
        note.className = "location-identity-note";
        const cta = contactCard.querySelector(".button");
        cta ? contactCard.insertBefore(note, cta) : contactCard.appendChild(note);
      }
      note.textContent = text.contact;
    }
  }

  function start() {
    initialisePortfolio();
    applyLanguageAndLocation();
    document.querySelectorAll("[data-lang]").forEach(button => {
      button.addEventListener("click", () => requestAnimationFrame(applyLanguageAndLocation));
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start, { once: true });
  } else {
    start();
  }
})();
'''
          Path('portfolio-slider.js').write_text(js, encoding='utf-8')

          css = r'''/* Stable static portfolio categories */
.portfolio-section {
  content-visibility: auto;
  contain-intrinsic-size: 820px;
}

.portfolio-category-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.portfolio-category { min-width: 0; }

.portfolio-category-media {
  position: relative;
  overflow: hidden;
  aspect-ratio: 1 / 1;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 24px;
  background: #07111e;
  isolation: isolate;
  touch-action: pan-y;
}

.portfolio-category-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  opacity: 1;
  transform: scale(1);
  transition: transform 0.35s ease, opacity 0.18s ease;
}

.portfolio-category-image.is-changing { opacity: 0.28; transform: scale(1.015); }
.portfolio-category:hover .portfolio-category-image { transform: scale(1.025); }

.portfolio-category-shade {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: linear-gradient(180deg, rgba(4, 12, 23, 0.12) 10%, rgba(4, 12, 23, 0.22) 45%, rgba(4, 12, 23, 0.96) 100%);
  pointer-events: none;
}

.portfolio-category-label {
  position: absolute;
  top: 17px;
  left: 17px;
  z-index: 2;
  max-width: calc(100% - 34px);
  padding: 8px 12px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 999px;
  background: rgba(5, 15, 27, 0.82);
  color: #fff;
  font-size: 0.76rem;
  font-weight: 700;
  line-height: 1.2;
  backdrop-filter: blur(8px);
}

.portfolio-category-copy {
  position: absolute;
  right: 18px;
  bottom: 72px;
  left: 18px;
  z-index: 2;
}

.portfolio-category-description {
  margin: 0 0 7px;
  color: rgba(255, 255, 255, 0.78);
  font-size: 0.8rem;
  line-height: 1.4;
}

.portfolio-category-item-title {
  margin: 0;
  color: #fff;
  font-size: clamp(1.08rem, 1.45vw, 1.42rem);
  line-height: 1.15;
}

.portfolio-category-controls {
  position: absolute;
  right: 15px;
  bottom: 14px;
  left: 15px;
  z-index: 3;
  display: grid;
  grid-template-columns: 40px 1fr 40px;
  align-items: center;
  gap: 10px;
}

.portfolio-category-button {
  display: inline-grid;
  width: 40px;
  height: 40px;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 50%;
  background: rgba(5, 15, 27, 0.82);
  color: #fff;
  cursor: pointer;
  font: inherit;
  font-size: 1.15rem;
  line-height: 1;
  backdrop-filter: blur(8px);
}

.portfolio-category-button:hover,
.portfolio-category-button:focus-visible {
  border-color: rgba(76, 215, 195, 0.7);
  background: rgba(76, 215, 195, 0.2);
}

.portfolio-category-button:focus-visible,
.portfolio-category-dot:focus-visible {
  outline: 3px solid rgba(76, 215, 195, 0.36);
  outline-offset: 2px;
}

.portfolio-category-counter {
  color: rgba(255, 255, 255, 0.84);
  font-size: 0.8rem;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.portfolio-category-dots {
  display: flex;
  min-height: 30px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding-top: 10px;
}

.portfolio-category-dot {
  width: 7px;
  height: 7px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.25);
  cursor: pointer;
  transition: width 0.2s ease, background 0.2s ease;
}

.portfolio-category-dot.is-active {
  width: 22px;
  background: rgba(76, 215, 195, 0.9);
}

.location-identity-note {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 18px 0;
  color: #c9f7f0;
  font-size: 0.9rem;
  font-weight: 680;
}

.location-identity-note::before {
  content: "";
  flex: 0 0 auto;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 5px rgba(76, 215, 195, 0.1);
}

@media (max-width: 1050px) {
  .portfolio-category-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .portfolio-category:last-child {
    grid-column: 1 / -1;
    width: calc((100% - 22px) / 2);
    justify-self: center;
  }
}

@media (max-width: 700px) {
  .reveal,
  .reveal.is-visible {
    opacity: 1 !important;
    transform: none !important;
    transition: none !important;
  }

  .site-header,
  .site-header.is-scrolled {
    background: #08111f !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }

  .portfolio-category-grid { grid-template-columns: 1fr; gap: 24px; }
  .portfolio-category:last-child {
    grid-column: auto;
    width: auto;
    justify-self: stretch;
  }
  .portfolio-category-media {
    width: min(100%, 430px);
    margin-inline: auto;
    border-radius: 22px;
  }
  .portfolio-category-description { font-size: 0.78rem; }
  .location-identity-note { align-items: flex-start; font-size: 0.86rem; line-height: 1.5; }
  .location-identity-note::before { margin-top: 0.42em; }
}

@media (prefers-reduced-motion: reduce) {
  .portfolio-category-image,
  .portfolio-category-dot { transition: none; }
}
'''
          Path('portfolio-gallery.css').write_text(css, encoding='utf-8')

          Path('.github/workflows/rebuild-static-portfolio.yml').unlink()
          PY

      - name: Commit stable portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

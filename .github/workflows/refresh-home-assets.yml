name: Refresh homepage assets

on:
  push:
    paths:
      - '.github/workflows/refresh-home-assets.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh homepage asset references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace(
              '<link rel="preload" as="image" href="assets/hero-ecosystem.svg" type="image/svg+xml" fetchpriority="high">',
              '<link rel="preload" as="image" href="assets/hero-narli-banner.webp?v=20260725-stable-1" type="image/webp" fetchpriority="high">'
          )
          html = html.replace(
              'site-email.js?v=20260724-no-flash-2',
              'site-email.js?v=20260725-stable-1'
          )
          html = html.replace(
              'hero-bootstrap.js?v=20260724-no-flash-2',
              'hero-bootstrap.js?v=20260725-stable-1'
          )
          html = html.replace(
              'src="assets/hero-ecosystem.svg" width="920" height="680"',
              'src="assets/hero-narli-banner.webp?v=20260725-stable-1" width="384" height="384"'
          )
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit refreshed references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/refresh-home-assets.yml
          git commit -m "Refresh homepage asset versions [skip ci]"
          git push

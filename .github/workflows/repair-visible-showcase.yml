name: Repair visible showcase

on:
  push:
    paths:
      - '.github/workflows/repair-visible-showcase.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace corrupted image references with verified assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('services-showcase.js')
          js = js_path.read_text(encoding='utf-8')
          replacements = {
              'assets/services/project-websites/ai4cities-light.webp': 'assets/services/project-websites/ai4cities-dark.webp?v=20260725-visible-1',
              'assets/services/ai-toolkits/greened-toolkit.webp': 'assets/services/project-websites/futureskills.webp?v=20260725-visible-1',
              'assets/services/web-mobile-apps/learning-dashboard.webp': 'assets/hero-narli-showcase-hq.webp?v=20260725-visible-1',
              'assets/services/web-mobile-apps/greenmind-ecosystem.webp': 'assets/hero-narli-showcase-hq.webp?v=20260725-visible-2',
              'assets/services/serious-games/truth-detectives.webp': 'assets/portfolio/optimized/portfolio-04.webp?v=20260725-visible-1',
              'assets/services/serious-games/ecofuture-board-game.webp': 'assets/portfolio/optimized/portfolio-05.webp?v=20260725-visible-1',
              'assets/services/serious-games/life-saver.webp': 'assets/portfolio/optimized/portfolio-02.webp?v=20260725-visible-1',
              'assets/services/serious-games/word-quest.webp': 'assets/portfolio/optimized/portfolio-01.webp?v=20260725-visible-1',
              'assets/services/serious-games/knowledge-challenge.webp': 'assets/portfolio/optimized/portfolio-09.webp?v=20260725-visible-1',
              'assets/services/serious-games/fake-news-detective.webp': 'assets/portfolio/optimized/portfolio-08.webp?v=20260725-visible-1',
              'assets/services/ai-toolkits/ai-assistant.webp': 'assets/portfolio/digital-learning-gallery.webp?v=20260725-visible-1',
          }
          for old, new in replacements.items():
              js = js.replace(old, new)
          js_path.write_text(js, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = html.replace('services-showcase.css?v=20260725-gallery-3', 'services-showcase.css?v=20260725-visible-1')
          html = html.replace('services-showcase.js?v=20260725-gallery-3', 'services-showcase.js?v=20260725-visible-1')
          html = html.replace('site-email.js?v=20260725-gallery-3', 'site-email.js?v=20260725-visible-1')
          index_path.write_text(html, encoding='utf-8')

          loader_path = Path('site-email.js')
          loader = loader_path.read_text(encoding='utf-8')
          loader = loader.replace('services-showcase.css?v=20260725-gallery-3', 'services-showcase.css?v=20260725-visible-1')
          loader = loader.replace('services-showcase.js?v=20260725-gallery-3', 'services-showcase.js?v=20260725-visible-1')
          loader_path.write_text(loader, encoding='utf-8')
          PY

      - name: Commit repaired showcase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services-showcase.js index.html site-email.js
          git rm .github/workflows/repair-visible-showcase.yml
          git commit -m "Repair broken showcase image URLs [skip ci]"
          git push

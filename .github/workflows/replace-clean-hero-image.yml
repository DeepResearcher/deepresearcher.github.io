name: Replace cleaned hero image

on:
  push:
    paths:
      - '.github/workflows/replace-clean-hero-image.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify cleaned hero image
        run: |
          cat .hero-image-staging/part* | base64 --decode > assets/hero-narli-devices.webp
          python3 - <<'PY'
          from pathlib import Path

          path = Path('assets/hero-narli-devices.webp')
          data = path.read_bytes()
          if len(data) < 12 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Decoded asset is not a valid WebP container')
          print(f'Verified WebP: {len(data)} bytes')
          PY

      - name: Commit cleaned hero artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-narli-devices.webp
          git rm -r .hero-image-staging
          git rm .github/workflows/replace-clean-hero-image.yml
          git commit -m "Remove stray dash from hero artwork [skip ci]"
          git push

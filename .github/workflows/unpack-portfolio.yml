name: Unpack portfolio originals

on:
  push:
    paths:
      - "WhatsApp Image 2026-07-19 at 22.16.45 (2).zip"
      - ".github/workflows/unpack-portfolio.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract original images
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE='WhatsApp Image 2026-07-19 at 22.16.45 (2).zip'
          rm -rf .portfolio-unpack assets/portfolio/originals
          mkdir -p .portfolio-unpack assets/portfolio/originals
          unzip -o "$ZIP_FILE" -d .portfolio-unpack

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, shutil

          source = Path('.portfolio-unpack')
          target = Path('assets/portfolio/originals')
          allowed = {'.jpg', '.jpeg', '.png', '.webp', '.gif', '.avif'}
          files = sorted(
              (p for p in source.rglob('*') if p.is_file() and p.suffix.lower() in allowed),
              key=lambda p: str(p).lower(),
          )

          seen = set()
          manifest = []
          number = 0
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest in seen:
                  continue
              seen.add(digest)
              number += 1
              extension = path.suffix.lower().replace('.jpeg', '.jpg')
              destination = target / f'portfolio-{number:02d}{extension}'
              shutil.copyfile(path, destination)
              manifest.append({
                  'file': destination.name,
                  'source_name': path.name,
                  'sha256': digest,
                  'bytes': destination.stat().st_size,
              })

          (target / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'Extracted {len(manifest)} unique images')
          PY

          rm -rf .portfolio-unpack

      - name: Commit extracted images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portfolio/originals
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "Extract original portfolio images"
          git push

# Cloudflare Worker behind https://www.narli-digital.de/api/contact (website request form).
# Deploy from this folder with:  npx wrangler deploy
#
# The inbox address is not kept in this public repository. Set it once with
#   npx wrangler secret put CONTACT_TO
# It must be a verified destination address in Cloudflare Email Routing (the inbox that
# info@narli-digital.de forwards to); Cloudflare refuses to send anywhere else.
name = "narli-contact-form"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "www.narli-digital.de/api/contact", zone_name = "narli-digital.de" },
  { pattern = "narli-digital.de/api/contact", zone_name = "narli-digital.de" },
]

[vars]
CONTACT_FROM = "website@narli-digital.de"

[[send_email]]
name = "MAIL"

# At most 5 messages per minute from one IP address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Workers KV "narli-mail-undelivered" (binding UNDELIVERED) keeps mail for info@ that the inbox
# refused. The deploy workflow creates it if needed and adds the binding here at deploy time.
